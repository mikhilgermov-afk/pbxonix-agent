name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Linux tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  oldest:
    name: Legacy Issabel (Python 3.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src python:3.6-slim
          sh -c 'pip install -q "pytest<7" && python -m pytest -q -p no:cacheprovider'

  lint:
    name: Lint and installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check pbxonix_agent tests
      - run: sh -n install/agent.sh && sh -n install/install.sh && sh -n install-quality-clock.sh
      - run: python scripts/check_release.py

  package:
    name: Build and dependency-free installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - name: Install without accessing PyPI
        run: |
          python -m venv /tmp/pbxonix-clean
          /tmp/pbxonix-clean/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/pbxonix-clean/bin/python -c "import pbxonix_agent.cli, pbxonix_agent.runner; print('imports clean')"
          /tmp/pbxonix-clean/bin/pbxonix-agent --help

