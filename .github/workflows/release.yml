name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python -m pip install build && python -m build
      - name: Prepare downloads
        run: |
          cp install/agent.sh install/install.sh install-quality-clock.sh LICENSE NOTICE dist/
          cd dist
          sha256sum *.whl *.tar.gz *.sh LICENSE NOTICE > SHA256SUMS
      - name: Publish release
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "PBXonix Agent ${RELEASE_TAG#v}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
